<main id="main">

  <section id="work">
    <div class="wrap">
      <div class="sec-head">
        <h2>Work</h2>
        <span class="greek">ἔργα &middot; works</span>
      </div>
    <p class="sec-note">coming soon...</p>


      <div class="filters" role="group" aria-label="Filter work by type">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="painting" aria-pressed="false">Painting</button>
        <button type="button" data-filter="fashion" aria-pressed="false">Fashion &amp; sewing</button>
      </div>

      <div class="grid">

        <figure class="tile" data-cat="painting">
          <div class="swatch p-grid"><span class="slot mono">Add image here</span></div>
          <figcaption>
            <span class="mono kind">Painting</span>
            <span class="title">Painting title</span>
            <span class="meta">Year, medium, size</span>
          </figcaption>
        </figure>

        <figure class="tile" data-cat="fashion">
          <div class="swatch p-stripe"><span class="slot mono">Add image here</span></div>
          <figcaption>
            <span class="mono kind">Fashion design</span>
            <span class="title">Collection or look title</span>
            <span class="meta">Year, fabric, what I made</span>
          </figcaption>
        </figure>
        <figure class="tile" data-cat="fashion">
          <div class="swatch p-twill"><span class="slot mono">Add image here</span></div>
          <figcaption>
            <span class="mono kind">Fashion design</span>
            <span class="title">Sketch or illustration</span>
            <span class="meta">Year, medium, inspiration</span>
          </figcaption>
        </figure>
        <figure class="tile" data-cat="fashion">
          <div class="swatch p-check"><span class="slot mono">Add image here</span></div>
          <figcaption>
            <span class="mono kind">Sewing</span>
            <span class="title">Sewn piece title</span>
            <span class="meta">Year, pattern, fabric</span>
          </figcaption>
        </figure>
      </div>
    </div>
  </section>

</main>
